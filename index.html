<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sepatu.id</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header class="top-header">
        <div class="logo-container">
            <img src="asset/picture/logo.png" alt="Logo Header" class="header-img"> 
            <span>SEPATU.ID</span>
        </div>
        <div class="nav-buttons">
            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                <!-- Icon Bulan (Dark Mode) - Default Icon for Light Theme -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
            <a href="index.html" class="btn-primary">Refresh</a>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="center-logo-area">
                <img src="asset/picture/logo.png" alt="Logo Login" class="center-img">
            </div> 
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details to sign in</p>

            <form action="utama/utama.html">
                <div class="input-group">
                    <input type="text" id="txtUsername" placeholder="Username" required autocomplete="off">
                </div>

                <div class="input-group">
                    <input type="password" id="txtPassword" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-login">LOGIN</button>

                <div class="forgot-pass">
                    <a href="#">Forgot password? Reset here</a>
                </div>
            </form>

            <form action="register.html">
                <button type="submit" class="btn-register-new">CREATE ACCOUNT</button>
            </form>
        </div>
    </div>

    <script src="javascript/navbar.js"></script>
</body>
</html>
