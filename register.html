<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sepatu.id</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- <header class="top-header">
        <div class="logo-container">
            <img src="asset/picture/logo.png" alt="Logo Header" class="header-img"> 
            <span>SEPATU.ID</span>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="btn-primary">Back to Login</a>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="center-logo-area">
                <img src="asset/picture/logo.png" alt="Logo Login" class="center-img">
            </div> 
            
            <h2>Create Account</h2>
            <p class="subtitle">Join us and start your journey</p>

            <form action="index.html">
                <div class="input-group">
                    <input type="text" id="regUsername" placeholder="Username" required autocomplete="off">
                </div>

                <div class="input-group">
                    <input type="email" id="regEmail" placeholder="Email Address" required autocomplete="off">
                </div>

                <div class="input-group">
                    <input type="password" id="regPassword" placeholder="Password" required>
                </div>
                
                <button type="submit" class="btn-login">REGISTER</button>
            </form>
            
            <div class="forgot-pass">
                Already have an account? <a href="index.html" style="color:#007bff; font-weight:bold;">Log In</a>
            </div>
        </div>
    </div>

</body>
</html>
